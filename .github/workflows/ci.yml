name: Cutover checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python tests/check_mcp.py
      - run: python -m cutover --reference bridge --output work/bridge.json
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-evidence-${{ matrix.os }}
          path: work/bridge.json
