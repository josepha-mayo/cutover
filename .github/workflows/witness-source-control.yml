name: Witness source controls
on: pull_request
permissions:
  contents: read
jobs:
  control:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: {"include":[{"name":"late-window","classification":"verified_block","coverage":"108/124","line":8,"outcome":"failure","lock":"6455c1c197d93e0bdd5915232d94e4558514efe9d3245d576d970172e8f9b5a5"},{"name":"completed-rollout","classification":"verified_block","coverage":"100/132","line":null,"outcome":"failure","lock":"ecf66707fc8fe5a8a59f4dbfda92bed4377352cb190c6ad23d69271c8b325418"},{"name":"bob-repair","classification":"verified_pass","coverage":"116/116","line":null,"outcome":"success","lock":"6455c1c197d93e0bdd5915232d94e4558514efe9d3245d576d970172e8f9b5a5"}]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: review
        uses: josepha-mayo/cutover@aac1bb70462bbc43e2f9298a66fb09be5906f7aa
        continue-on-error: true
        with:
          contract: control/witness-source/${{ matrix.name }}/contract.json
          plan: control/witness-source/${{ matrix.name }}/adapters.json
          migration-file: control/witness-source/${{ matrix.name }}/migration.sql
          expected-contract-hash: ${{ matrix.lock }}
          output-dir: control-output/${{ matrix.name }}
          artifact-name: witness-source-${{ matrix.name }}
      - name: Assert the prospectively specified outcome
        env:
          CONTROL_NAME: ${{ matrix.name }}
          ACTION_CLASSIFICATION: ${{ steps.review.outputs.classification }}
          ACTION_COVERAGE: ${{ steps.review.outputs.coverage }}
          ACTION_OUTCOME: ${{ steps.review.outcome }}
        run: python control/witness-source/assert_control.py
