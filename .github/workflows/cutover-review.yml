name: Cutover candidate review

# Pull-request gate: run the Cutover CLI and independent audit against the
# checked-in contract and candidate plans. Each migration gets its own verdict
# and evidence artifact, so one passing contract cannot mask another's block.
# Evidence artifacts are uploaded
# unconditionally so a blocked or unverified run still provides a full record.
#
# Add validated contract/plan pairs to ci/cases.json; no YAML edit is needed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    name: Validate release cases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: cases
        name: Validate manifest and case inputs
        run: python -m ci.discover_cases --github-output "$GITHUB_OUTPUT"

  review:
    name: Review ${{ matrix.case }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Cutover review gate
        run: >
          python ci/review_gate.py
          --contract "${{ matrix.contract }}"
          --plan "${{ matrix.plan }}"
          --migration-file "${{ matrix.migration_file }}"
          --output-dir "work/ci-review/${{ matrix.slug }}"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-${{ matrix.slug }}-review-evidence
          path: |
            work/ci-review/${{ matrix.slug }}/report.json
            work/ci-review/${{ matrix.slug }}/review.md
            work/ci-review/${{ matrix.slug }}/review.zip
            work/ci-review/${{ matrix.slug }}/summary.md
            work/ci-review/${{ matrix.slug }}/verdict.json
            work/ci-review/${{ matrix.slug }}/effective-plan.json
          if-no-files-found: warn
